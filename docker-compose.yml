# Build : NE PAS utiliser `docker compose up --build` (8 images en parallèle → cache containerd corrompu).
#   1. Redémarrer Docker Desktop si erreur overlayfs/snapshots
#   2. .\scripts\docker-recover.ps1
#   3. .\scripts\docker-build-safe.ps1
#   4. docker compose up -d
# ─── Métadonnées (non consommées par Docker ; référence intégration Documentation) ───
# API métier & temps réel : uniquement via api-gateway (hôte 5000 → conteneur 8080).
# Les frontends nginx proxy /api/ et /hubs/ vers api-gateway — pas d’appel navigateur direct aux backends.
x-documentation-integration:
  public_gateway_base: "http://localhost:5000"
  documentation_api_prefixes: "/api/documentation,/api/generate-document-ai"
  documentation_signalr_hub: "/hubs/documentation"

services:

  # ─── DATABASE UNIQUE ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kyntus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservices-network

  # ─── BACKENDS ─────────────────────────────────────────
  auth-backend:
    build:
      context: ./AuthService/AuthService
      dockerfile: Dockerfile
    container_name: kyntus_auth_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=auth_db;Username=auth_user;Password=Auth@2026"
    ports:
      - "5220:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  # One-shot : insère 2 utilisateurs atlas-tech-demo dans auth_db."Users" après migrations auth-backend.
  auth-atlas-doc-users-seed:
    image: postgres:16-alpine
    container_name: kyntus_seed_auth_atlas_doc_users
    restart: "no"
    environment:
      PGPASSWORD: Postgres@2026
    depends_on:
      postgres:
        condition: service_healthy
      auth-backend:
        condition: service_started
    volumes:
      - ./init/sql/auth_insert_atlas_doc_users.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        i=0
        while [ "$$i" -lt 90 ]; do
          if psql -h postgres -U postgres -d auth_db -tAc 'SELECT 1 FROM "Users" LIMIT 1' 2>/dev/null | grep -qx 1; then
            psql -h postgres -U postgres -d auth_db -v ON_ERROR_STOP=1 -f /seed.sql
            echo "init: auth_insert_atlas_doc_users.sql applied"
            exit 0
          fi
          i=$$((i + 1))
          sleep 2
        done
        echo "init: timeout waiting for auth Users table" >&2
        exit 1
    networks:
      - microservices-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kyntus_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # Évite les échecs eacces sur .erlang.cookie (souvent vus sous Docker Desktop / WSL2).
      RABBITMQ_ERLANG_COOKIE: kyntus-dev-erlang-cookie
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - microservices-network

  planning-backend:
    build:
      context: ./PlanningService/PlanningService
      dockerfile: Dockerfile
    container_name: kyntus_planning_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      KYNTUS_PLANNING_DEMO_SEED: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=kyntus_db;Username=kyntus_user;Password=Kyntus@2026"
    ports:
      - "5201:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  formation-backend:
    build:
      context: ./FormationService
      dockerfile: projetformationconges/Dockerfile
    container_name: kyntus_formation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      KYNTUS_FORMATION_DEMO_SEED: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=formation_db;Username=formation_user;Password=Formation@2026"
    ports:
      - "5210:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  # Documentation : HTTP interne 8080 ; exposition hôte 5230 = diagnostic uniquement (métier via gateway :5000).
  documentation-backend:
    build:
      context: .
      dockerfile: init/DocumentationBackend.Dockerfile
    container_name: kyntus_documentation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Crée le schéma documentation + tables au premier démarrage (init.sql ne contient pas le DDL métier).
      Documentation__ApplyBootstrapSchema: "true"
      Documentation__DemoDataSeed: "true"
      Documentation__DefaultTenantId: "atlas-tech-demo"
      DocumentationDb__Password: "Documentation@2026"
      ConnectionStrings__Documentation: "Host=postgres;Port=5432;Database=documentation_db;Username=documentation_user;Password=Documentation@2026"
    ports:
      - "5230:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network
# ─── CONGE BACKEND ───────────────────────────────────
  # ✅ FIX : ajout depends_on rabbitmq + user dédié conge_user
  conge-backend:
    build:
      context: ./FormationService
      dockerfile: Conge.API/Dockerfile
    container_name: kyntus_conge_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CongeDb: "Host=postgres;Port=5432;Database=conge_db;Username=postgres;Password=Postgres@2026"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    ports:
      - "5240:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # One-shot : crée prime_db + prime_user si le volume Postgres existait avant l’ajout du bloc PRIME dans init.sql.
  prime-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_prime_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: Postgres@2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/prime_database.sql:/prime_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'prime_db'" | grep -qx 1; then
          echo "prime_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /prime_database.sql
        echo "prime_db: created"
    networks:
      - microservices-network

  prime-backend:
    build:
      context: ./PrimeBackend
      dockerfile: Dockerfile
    container_name: kyntus_prime_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=prime_db;Username=prime_user;Password=Prime@2026"
      Prime__SeedDemoData: "true"
      Prime__EnrichDemoData: "true"
      Prime__AllowDemoSeedEndpoint: "true"
    ports:
      - "5250:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/prime/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      prime-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  # One-shot : crée parrainage_db + parrainage_user si le volume Postgres existait avant l’ajout du bloc PARRAINAGE dans init.sql.
  parrainage-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_parrainage_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: Postgres@2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/parrainage_database.sql:/parrainage_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'parrainage_db'" | grep -qx 1; then
          echo "parrainage_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /parrainage_database.sql
        echo "parrainage_db: created"
    networks:
      - microservices-network

  parrainage-backend:
    build:
      context: ./parrainage_service_backend
      dockerfile: Dockerfile
    container_name: kyntus_parrainage_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=parrainage_db;Username=parrainage_user;Password=Parrainage@2026"
      # Seed 15 parrainages + règles si tables vides (EF Migrate au démarrage).
      Parrainage__SeedDemoData: "true"
      # POST /api/parrainage/dev/seed (outil dev, calqué Prime).
      Parrainage__AllowDemoSeedEndpoint: "true"
      Parrainage__UploadPath: "/app/uploads/cv"
    volumes:
      - parrainage_cv_uploads:/app/uploads
    ports:
      - "5260:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/parrainage/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      parrainage-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  # ─── API GATEWAY ──────────────────────────────────────
  # Point d’entrée unique côté HTTP pour /api/* et /hubs/* (Ocelot : init/ocelot.gateway.json).
  api-gateway:
    build:
      context: ./ApiGateway.API/ApiGateway.API
      dockerfile: Dockerfile
    container_name: kyntus_gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5000:8080"
    volumes:
      - ./init/ocelot.gateway.json:/app/ocelot.json:ro
    depends_on:
      auth-atlas-doc-users-seed:
        condition: service_completed_successfully
      auth-backend:
        condition: service_started
      planning-backend:
        condition: service_started
      formation-backend:
        condition: service_started
      documentation-backend:
        condition: service_started
      prime-backend:
        condition: service_healthy
      parrainage-backend:
        condition: service_healthy
    networks:
      - microservices-network

  # ─── FRONTENDS ────────────────────────────────────────
  auth-frontend:
    build:
      context: ./auth-frontend
      dockerfile: DockerFile
    container_name: kyntus_auth_frontend
    restart: unless-stopped
    ports:
      - "4201:4000"
    environment:
      - API_URL=http://api-gateway:8080
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  planning-frontend:
    build:
      context: ./projet_kyntus_service_planning-frontend
      dockerfile: Dockerfile
    container_name: kyntus_planning_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - microservices-network

  prime-frontend:
    build:
      context: ./prime-angular
      dockerfile: Dockerfile
    container_name: kyntus_prime_frontend
    restart: unless-stopped
    # Module Prime (Angular) : http://localhost:4202 — pas le port 4200 (planning). Après changement UI : rebuild sans cache.
    #   docker compose build --no-cache prime-frontend && docker compose up -d prime-frontend
    # Données démo Maroc (Bogus, org existante) : GET http://localhost:5000/api/prime/demo/enrichment-status
    #   puis POST http://localhost:5000/api/prime/demo/enrich?force=true && docker compose restart prime-backend
    # Si 4202 est encore pris par un ancien conteneur : `docker compose down` puis `up`, ou remplacez par ex. "4207:80".
    ports:
      - "4202:80"
    depends_on:
      api-gateway:
        condition: service_started
    # Si /api/* renvoie 404 : vérifier que api-gateway tourne (port 5000) puis
    #   docker compose up -d api-gateway && docker compose restart prime-frontend
    networks:
      - microservices-network

  parrainage-frontend:
    build:
      context: ./parrainage-angular
      dockerfile: Dockerfile
    container_name: kyntus_parrainage_frontend
    restart: unless-stopped
    ports:
      - "4203:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - microservices-network

  # ─── PGADMIN ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: kyntus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kyntus.ma
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - microservices-network

volumes:
  postgres_data:
  rabbitmq_data:
  parrainage_cv_uploads:

networks:
  microservices-network:
    driver: bridge