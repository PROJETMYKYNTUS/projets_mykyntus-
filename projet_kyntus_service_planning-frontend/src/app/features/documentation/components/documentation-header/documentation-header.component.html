<header
  class="h-20 px-8 flex items-center justify-between bg-app/80 backdrop-blur-md border-b border-default sticky top-0 z-40 transition-colors duration-300"
>
  <div class="min-w-0 flex-1 pr-6">
    <h1 class="text-lg font-semibold text-primary tracking-tight truncate">{{ title }}</h1>
  </div>
  <div class="flex items-center gap-4">
    <div class="relative group hidden md:block">
      <app-doc-icon
        name="search"
        klass="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted group-focus-within:text-blue-500 transition-colors"
      ></app-doc-icon>
      <input
        type="text"
        [placeholder]="app.t('header.search')"
        class="bg-card/50 border border-default rounded-full py-2 pl-10 pr-4 text-sm text-primary focus:outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 w-64 transition-all placeholder:text-muted shadow-inner"
      />
    </div>

    <div class="flex items-center gap-2 border-l border-default pl-4">
      <button
        type="button"
        class="relative p-2 rounded-lg text-muted hover:text-primary hover:bg-card border border-transparent hover:border-default transition-all"
        (click)="toggleNotif()"
        [attr.aria-expanded]="ui.notifOpen()"
        aria-label="Notifications"
      >
        <app-doc-icon name="bell" klass="w-5 h-5"></app-doc-icon>
        @if (unreadCount() > 0) {
          <span
            class="absolute -top-0.5 -right-0.5 min-w-[1.125rem] h-[1.125rem] px-1 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center"
          >
            {{ unreadCount() > 9 ? '9+' : unreadCount() }}
          </span>
        }
      </button>
      <button
        type="button"
        class="p-2 rounded-lg text-muted hover:text-primary hover:bg-card border border-transparent hover:border-default transition-all"
        (click)="toggleSettings()"
        [attr.aria-expanded]="ui.settingsOpen()"
        aria-label="Paramètres"
      >
        <app-doc-icon name="settings" klass="w-5 h-5"></app-doc-icon>
      </button>
    </div>
  </div>
</header>

<app-documentation-notification-flyout />
<app-documentation-settings-flyout />
