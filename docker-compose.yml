# Secrets : copier .env.example → .env à la racine (non versionné).
# ─── Ports hôte Kyntus (évite conflit avec un autre projet Docker sur 4200–5260) ───
# UI login          8201   | SPA unifiée (planning + prime + parrainage) 8200
# API Gateway       8500   | Postgres hôte   8433   | pgAdmin         8505
# auth-backend      8520   | planning        8521   | formation       8522   | documentation 8530
# conge             8540   | prime           8550   | parrainage      8560
# RabbitMQ          8672   | RabbitMQ UI     18672
x-documentation-integration:
  public_gateway_base: "http://localhost:8500"
  documentation_api_prefixes: "/api/documentation,/api/generate-document-ai"
  documentation_signalr_hub: "/hubs/documentation"

x-kyntus-jwt: &kyntus-jwt
  JwtSettings__Secret: ${KYNTUS_JWT_SECRET:?Définir KYNTUS_JWT_SECRET dans .env}
  JwtSettings__Issuer: ${KYNTUS_JWT_ISSUER:-AuthService}
  JwtSettings__Audience: ${KYNTUS_JWT_AUDIENCE:-AuthServiceClient}

x-kyntus-rabbitmq: &kyntus-rabbitmq
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ${KYNTUS_RABBITMQ_USER:-guest}
  RabbitMQ__Password: ${KYNTUS_RABBITMQ_PASSWORD:?Définir KYNTUS_RABBITMQ_PASSWORD dans .env}

services:

  # ─── DATABASE UNIQUE ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kyntus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KYNTUS_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
      KYNTUS_DB_PASSWORD_KYNTUS: ${KYNTUS_DB_PASSWORD_KYNTUS:?Définir KYNTUS_DB_PASSWORD_KYNTUS dans .env}
      KYNTUS_DB_PASSWORD_AUTH: ${KYNTUS_DB_PASSWORD_AUTH:?Définir KYNTUS_DB_PASSWORD_AUTH dans .env}
      KYNTUS_DB_PASSWORD_FORMATION: ${KYNTUS_DB_PASSWORD_FORMATION:?Définir KYNTUS_DB_PASSWORD_FORMATION dans .env}
      KYNTUS_DB_PASSWORD_DOCUMENTATION: ${KYNTUS_DB_PASSWORD_DOCUMENTATION:?Définir KYNTUS_DB_PASSWORD_DOCUMENTATION dans .env}
      KYNTUS_DB_PASSWORD_CONGE: ${KYNTUS_DB_PASSWORD_CONGE:?Définir KYNTUS_DB_PASSWORD_CONGE dans .env}
      KYNTUS_DB_PASSWORD_PRIME: ${KYNTUS_DB_PASSWORD_PRIME:?Définir KYNTUS_DB_PASSWORD_PRIME dans .env}
      KYNTUS_DB_PASSWORD_PARRAINAGE: ${KYNTUS_DB_PASSWORD_PARRAINAGE:?Définir KYNTUS_DB_PASSWORD_PARRAINAGE dans .env}
      KYNTUS_DB_PASSWORD_DIRECTORY: ${KYNTUS_DB_PASSWORD_DIRECTORY:?Définir KYNTUS_DB_PASSWORD_DIRECTORY dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "8433:5432"
    healthcheck:
      # pg_isready alone is true before /docker-entrypoint-initdb.d/init.sql finishes on a fresh volume.
      test:
        - CMD-SHELL
        - >
          pg_isready -U postgres -q &&
          psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='auth_db'" | grep -q 1 &&
          psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='employee_directory_db'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - microservices-network

  # ─── BACKENDS ─────────────────────────────────────────
  auth-backend:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: kyntus_auth_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_AUTH:?Définir KYNTUS_CONN_AUTH dans .env}
      DemoSeed__Enabled: ${KYNTUS_DEMO_SEED_ENABLED:-true}
      DemoSeed__Passwords__Employee: ${KYNTUS_DEMO_SEED_PASSWORD_EMPLOYEE:-Azerty@123}
      DemoSeed__Passwords__RH: ${KYNTUS_DEMO_SEED_PASSWORD_RH:-Azerty@123}
      DemoSeed__Passwords__Manager: ${KYNTUS_DEMO_SEED_PASSWORD_MANAGER:-Azerty@123}
      DemoSeed__Passwords__Coach: ${KYNTUS_DEMO_SEED_PASSWORD_COACH:-Azerty@123}
      DemoSeed__Passwords__RP: ${KYNTUS_DEMO_SEED_PASSWORD_RP:-Azerty@123}
      DemoSeed__Passwords__Admin: ${KYNTUS_DEMO_SEED_PASSWORD_ADMIN:-Azerty@123}
      DemoSeed__Passwords__Audit: ${KYNTUS_DEMO_SEED_PASSWORD_AUDIT:-Azerty@123}
      DemoSeed__Passwords__Formation: ${KYNTUS_DEMO_SEED_PASSWORD_FORMATION:-Azerty@123}
      DemoSeed__Passwords__Superviseur: ${KYNTUS_DEMO_SEED_PASSWORD_SUPERVISEUR:-Azerty@123}
      <<: *kyntus-jwt
    ports:
      - "8520:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kyntus_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${KYNTUS_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${KYNTUS_RABBITMQ_PASSWORD:?Définir KYNTUS_RABBITMQ_PASSWORD dans .env}
      # Évite les échecs eacces sur .erlang.cookie (souvent vus sous Docker Desktop / WSL2).
      RABBITMQ_ERLANG_COOKIE: ${KYNTUS_RABBITMQ_ERLANG_COOKIE:?Définir KYNTUS_RABBITMQ_ERLANG_COOKIE dans .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/rabbitmq
        if [ -n "$$RABBITMQ_ERLANG_COOKIE" ]; then
          printf '%s' "$$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie
          chmod 600 /var/lib/rabbitmq/.erlang.cookie
        fi
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "8672:5672"
      - "18672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - microservices-network
  planning-backend:
    build:
      context: .
      dockerfile: PlanningService/Dockerfile
    container_name: kyntus_planning_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PLANNING:?Définir KYNTUS_CONN_PLANNING dans .env}
      Directory__BaseUrl: http://employee-directory-backend:8080/
      Directory__WriteMaster: "true"
      Directory__RequireEnsureOnWrite: "false"
      Directory__EnablePlanningBootstrap: "false"
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    ports:
      - "8521:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Migrations + seed seulement avant /health ; marge pour rebuild lent sous Windows.
      retries: 30
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  formation-backend:
    build:
      context: .
      dockerfile: init/FormationBackend.Dockerfile
    container_name: kyntus_formation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_FORMATION:?Définir KYNTUS_CONN_FORMATION dans .env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8522:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # Documentation : HTTP interne 8080 ; exposition hôte 5230 = diagnostic uniquement (métier via gateway :5000).
  documentation-backend:
    build:
      context: .
      dockerfile: documentation_service_backend/Dockerfile
    container_name: kyntus_documentation_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Crée le schéma documentation + tables au premier démarrage (init.sql ne contient pas le DDL métier).
      Documentation__ApplyBootstrapSchema: "true"
      Documentation__AllowHeaderContextFallback: "true"
      Documentation__DefaultTenantId: "atlas-tech-demo"
      DocumentationDb__Password: ${KYNTUS_DOCUMENTATION_DB_PASSWORD:?Définir KYNTUS_DOCUMENTATION_DB_PASSWORD dans .env}
      ConnectionStrings__Documentation: ${KYNTUS_CONN_DOCUMENTATION:?Définir KYNTUS_CONN_DOCUMENTATION dans .env}
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    ports:
      - "8530:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # ─── CONGE BACKEND ───────────────────────────────────
  conge-backend:
    build:
      context: .
      dockerfile: FormationService/Conge.API/Dockerfile
    container_name: kyntus_conge_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CongeDb: ${KYNTUS_CONN_CONGE:?Définir KYNTUS_CONN_CONGE dans .env}
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    ports:
      - "8540:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # One-shot : crée prime_db + prime_user si le volume Postgres existait avant l’ajout du bloc PRIME dans init.sql.
  prime-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_prime_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/prime_database.sql:/prime_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'prime_db'" | grep -qx 1; then
          echo "prime_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /prime_database.sql
        echo "prime_db: created"
    networks:
      - microservices-network

  prime-backend:
    build:
      context: .
      dockerfile: PrimeBackend/Dockerfile
    container_name: kyntus_prime_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PRIME:?Définir KYNTUS_CONN_PRIME dans .env}
      Planning__BaseUrl: http://planning-backend:8080/
      Prime__AutoProvisionEmployeeFromJwt: "true"
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    ports:
      - "8550:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/prime/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prime-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  employee-directory-backend:
    build:
      context: .
      dockerfile: EmployeeDirectory/Dockerfile
    container_name: kyntus_employee_directory_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_DIRECTORY:?Définir KYNTUS_CONN_DIRECTORY dans .env}
      Prime__BaseUrl: http://prime-backend:8080/
      Planning__BaseUrl: http://planning-backend:8080/
      Htel__BaseUrl: https://htel-groupe.fr/
      Htel__ApiKey: ${HTEL_API_KEY:-}
      Directory__EnablePrimeBootstrap: "false"
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    ports:
      - "8565:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/directory/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network

  # One-shot : crée / aligne employee_directory_db + directory_user (volume Postgres ancien).
  employee-directory-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_employee_directory_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
      KYNTUS_DB_PASSWORD_DIRECTORY: ${KYNTUS_DB_PASSWORD_DIRECTORY:?Définir KYNTUS_DB_PASSWORD_DIRECTORY dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done

        # Escape ' pour littéral SQL
        ESC=$$(printf '%s' "$$KYNTUS_DB_PASSWORD_DIRECTORY" | sed "s/'/''/g")

        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'directory_user'" | grep -qx 1; then
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "ALTER USER directory_user WITH PASSWORD '$$ESC';"
        else
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "CREATE USER directory_user WITH PASSWORD '$$ESC';"
        fi

        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'employee_directory_db'" | grep -qx 1; then
          echo "employee_directory_db: already exists"
        else
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE employee_directory_db OWNER directory_user;"
          echo "employee_directory_db: created"
        fi

        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE employee_directory_db TO directory_user;"
        psql -h postgres -U postgres -d employee_directory_db -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO directory_user;"
        psql -h postgres -U postgres -d employee_directory_db -v ON_ERROR_STOP=1 -c "GRANT CREATE ON SCHEMA public TO directory_user;"
        echo "employee_directory_db: ready"
    networks:
      - microservices-network

  # One-shot : crée parrainage_db + parrainage_user si le volume Postgres existait avant l’ajout du bloc PARRAINAGE dans init.sql.
  parrainage-db-bootstrap:
    image: postgres:16-alpine
    container_name: kyntus_parrainage_db_bootstrap
    restart: "no"
    environment:
      PGPASSWORD: ${KYNTUS_POSTGRES_PASSWORD:?Définir KYNTUS_POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./init/sql/parrainage_database.sql:/parrainage_database.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until pg_isready -h postgres -p 5432 -U postgres -q; do sleep 2; done
        if psql -h postgres -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'parrainage_db'" | grep -qx 1; then
          echo "parrainage_db: already exists"
          exit 0
        fi
        psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f /parrainage_database.sql
        echo "parrainage_db: created"
    networks:
      - microservices-network

  parrainage-backend:
    build:
      context: .
      dockerfile: parrainage_service_backend/Dockerfile
    container_name: kyntus_parrainage_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${KYNTUS_CONN_PARRAINAGE:?Définir KYNTUS_CONN_PARRAINAGE dans .env}
      # Uploads CV (volume dédié).
      Parrainage__UploadPath: "/app/uploads/cv"
      Planning__BaseUrl: http://planning-backend:8080/
      <<: [*kyntus-jwt, *kyntus-rabbitmq]
    volumes:
      - parrainage_cv_uploads:/app/uploads
    ports:
      - "8560:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/parrainage/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      parrainage-db-bootstrap:
        condition: service_completed_successfully
    networks:
      - microservices-network

  # ─── API GATEWAY ──────────────────────────────────────
  # Point d’entrée unique côté HTTP pour /api/* et /hubs/* (Ocelot : init/ocelot.gateway.json).
  api-gateway:
    build:
      context: ./ApiGateway.API/ApiGateway.API
      dockerfile: Dockerfile
    container_name: kyntus_gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8500:8080"
    volumes:
      - ./init/ocelot.gateway.json:/app/ocelot.json:ro
    depends_on:
      auth-backend:
        condition: service_healthy
      planning-backend:
        condition: service_healthy
      formation-backend:
        condition: service_started
      documentation-backend:
        condition: service_started
      prime-backend:
        condition: service_healthy
      employee-directory-backend:
        condition: service_healthy
      parrainage-backend:
        condition: service_healthy
    networks:
      - microservices-network

  # ─── FRONTEND UNIFIÉ ──────────────────────────────────
  # SPA unique (shell + menu global des microservices). auth-frontend = login uniquement.
  auth-frontend:
    build:
      context: ./auth-frontend
      dockerfile: DockerFile
    container_name: kyntus_auth_frontend
    restart: unless-stopped
    ports:
      - "8201:4000"
    environment:
      - API_URL=http://api-gateway:8080
    volumes:
      - ./config/kyntus-public-urls.runtime.js:/app/dist/auth-frontend/browser/kyntus-public-urls.js:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  planning-frontend:
     build:
       context: ./projet_kyntus_service_planning-frontend
       dockerfile: Dockerfile
     container_name: kyntus_planning_frontend
     restart: unless-stopped
     ports:
       - "8200:80"
     volumes:
       - ./config/kyntus-public-urls.runtime.js:/usr/share/nginx/html/kyntus-public-urls.js:ro
     depends_on:
       api-gateway:
         condition: service_started
       planning-backend:
         condition: service_healthy
     networks:
       - microservices-network

  # ─── PGADMIN ──────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: kyntus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${KYNTUS_PGADMIN_EMAIL:-admin@kyntus.ma}
      PGADMIN_DEFAULT_PASSWORD: ${KYNTUS_PGADMIN_PASSWORD:?Définir KYNTUS_PGADMIN_PASSWORD dans .env}
    ports:
      - "8505:80"
    networks:
      - microservices-network

volumes:
  postgres_data:
  rabbitmq_data:
  parrainage_cv_uploads:

networks:
  microservices-network:
    driver: bridge
